[package]
name = "lampcode"
version = "0.1.0"
description = "Privacy-first desktop AI coding agent"
authors = ["Lamp Studios"]
license = "MIT"
edition = "2024"
rust-version = "1.94"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lampcode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["specta"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "=0.0.15"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi", "env-filter"] }
zeroize = "1"
keyring = "4.2"
age = "0.12"
thiserror = "2"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "http2", "charset"] }
futures-util = "0.3.34"
async-trait = "0.1.92"
url = "2.5.8"
bytes = "1.12.2"
tokio-util = { version = "0.7.20", features = ["rt"] }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std", "clock"] }
uuid = { version = "1.29.3", features = ["v4"] }
tauri-plugin-dialog = "2.8.4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
axum = "0.8.9"
tempfile = "3"
